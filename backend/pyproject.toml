[project]
name = "tv-home-backend"
version = "2.0.0"
description = "Local service behind TV Home 2.0: owns apps, Wi-Fi, Bluetooth, sound, display and power."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "dbus-fast>=2.24; sys_platform == 'linux'",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
tv-home-backend = "tv_home.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tv_home*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
